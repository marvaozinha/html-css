<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'Love';
            src: url('fontes/love\ story\ ttf.ttf') format('opentype'), url('fontes/love\ story\ ttf.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;


            /*
            Tipos de format()
            -opentype (otf)
            -truetype (ttf)
            -embedded-opentype
            -truetype-aat (Aple Advanced
            Typography)
            -svg
            */
        }  
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            font-family: "love"; times,serif;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>Olá, Mundo</h1>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. In dolore, sapiente accusamus deserunt, unde tempore quia nisi cum incidunt eaque odit inventore ipsa saepe perferendis suscipit placeat eveniet optio consequuntur?</p>
</body>
</html>
