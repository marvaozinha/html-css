<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de grid Layout</title>
    <link rel="stylesheet" href="style.css">
    <style>
        div.container {
            border: 3px;
            display: grid;
            justify-content: end;
          
        }

        div.item {
            border: 2px solid black;
            padding: 3px;
           
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="caixa" id="topo">
            Topo 
        </header>
        <nav class="caixa" id="menu">
            Menu
        </nav>
        <main class="caixa" id="Principal">
            Principal
        </main>
        <aside class="caixa" id="secundario">
            Secundário
        </aside>
        <footer class="caixa" id="rodape">
            Rodapé
        </footer>
    </div>
</body>
</html>
