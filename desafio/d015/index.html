<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de grid</title>
    <link rel="stylesheet" href="style.css">
    <style>
        div.container {
            border: 3px;
            display: grid;
            justify-content: end;
          
            
        }

        div.item {
            border: 2px solid black;
            padding: 3px;
           
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa1">Caixa 01</div>
        <div class="caixa2">Caixa 02</div>
        <div class="caixa3">Caixa 03</div>
        <div class="caixa4">Caixa 04</div>
        <div class="caixa5">Caixa 05</div>
        
    </div>
</body>
</html>
